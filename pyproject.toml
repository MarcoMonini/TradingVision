[project]
name = "tradingvision"
version = "0.1.0"
description = "Visualizzazione e analisi di candele crypto (dati Alpaca)."
requires-python = ">=3.12"
dependencies = [
    "pandas==2.3.1",
    "alpaca-py==0.42.0",
    "streamlit==1.47.1",
    "plotly==6.2.0",
    "ta==0.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
